<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" role="img"
  aria-label="An arcade cabinet with a glowing screen and a coin slot">
  <!-- cabinet body -->
  <rect x="10" y="6" width="100" height="148" rx="10" fill="#1a1c3a"
    stroke="#2e3166" stroke-width="3" />
  <!-- marquee -->
  <rect x="20" y="16" width="80" height="20" rx="4" fill="#e94f6a" />
  <rect x="24" y="20" width="72" height="12" rx="2" fill="#4fd1c5" />
  <!-- screen -->
  <rect x="20" y="44" width="80" height="50" rx="4" fill="#0b0e24"
    stroke="#2e3166" stroke-width="2" />
  <!-- game on the screen -->
  <circle cx="34" cy="80" r="6" fill="#f2c14e" />
  <circle cx="56" cy="80" r="2.5" fill="#e8e9f3" />
  <circle cx="68" cy="80" r="2.5" fill="#e8e9f3" />
  <circle cx="80" cy="80" r="2.5" fill="#e8e9f3" />
  <rect x="92" y="74" width="10" height="10" rx="2" fill="#e94f6a" />
  <!-- control panel: joystick and buttons -->
  <rect x="20" y="102" width="80" height="18" rx="4" fill="#2e3166" />
  <line x1="40" y1="103" x2="40" y2="108" stroke="#9aa0b8" stroke-width="3" />
  <circle cx="40" cy="110" r="5" fill="#f2c14e" />
  <circle cx="66" cy="111" r="4.5" fill="#e94f6a" />
  <circle cx="82" cy="111" r="4.5" fill="#4fd1c5" />
  <!-- coin slot -->
  <rect x="48" y="128" width="24" height="10" rx="2" fill="#0b0e24"
    stroke="#2e3166" stroke-width="2" />
  <rect x="56" y="131" width="8" height="4" rx="1" fill="#f2c14e" />
  <!-- base -->
  <rect x="18" y="142" width="84" height="8" rx="2" fill="#12142e" />
</svg>
